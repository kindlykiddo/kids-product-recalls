name: Update recall data

on:
  schedule:
    - cron: '17 14 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-recall-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download current KindlyKiddo exports
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://www.kindlykiddo.com/data/kids-product-recalls.json \
            --output data/kids-product-recalls.json
          curl --fail --silent --show-error --location --retry 3 \
            https://www.kindlykiddo.com/data/kids-product-recalls.csv \
            --output data/kids-product-recalls.csv

      - name: Validate downloads
        run: node scripts/validate.mjs

      - name: Commit changed data
        run: |
          if git diff --quiet -- data/; then
            echo "Recall data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kids-product-recalls.json data/kids-product-recalls.csv
          git commit -m "data: weekly refresh $(date -u +%F)"
          git push

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dataset publishing clients
        run: python -m pip install --disable-pip-version-check huggingface-hub==1.8.0 kaggle==1.7.4.5

      - name: Sync Hugging Face dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/sync-huggingface.py

      - name: Sync Kaggle dataset
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python scripts/sync-kaggle.py
